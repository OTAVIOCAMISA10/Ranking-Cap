<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Melhor Jogador dos Amigos Capivara 26K</title>
<style>
:root{--bg:#faf8f4;--card:#fff;--tx:#1f2430;--mu:#6b7280;--ac:#e8590c;--ac2:#fff1e6;--bd:#e5e1d8;box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){--bg:#15171c;--card:#1f232b;--tx:#eef0f4;--mu:#9aa1ad;--ac:#ff8a4c;--ac2:#33261c;--bd:#2f3440}}
:root[data-theme="dark"]{--bg:#15171c;--card:#1f232b;--tx:#eef0f4;--mu:#9aa1ad;--ac:#ff8a4c;--ac2:#33261c;--bd:#2f3440}
*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--tx);font:16px/1.45 system-ui,-apple-system,"Segoe UI",sans-serif}
main{max-width:720px;margin:0 auto;padding:20px 16px 60px}
h1{font-size:26px;margin:0 0 4px}h2{font-size:18px;margin:0 0 10px}
p.s{color:var(--mu);margin:0 0 18px}
.card{background:var(--card);border:1px solid var(--bd);border-radius:14px;padding:16px;margin-bottom:16px}
input,textarea,select{width:100%;font:inherit;color:var(--tx);background:var(--bg);border:1px solid var(--bd);border-radius:10px;padding:10px;margin:4px 0 12px}
label{font-size:14px;color:var(--mu)}
button{font:inherit;cursor:pointer;border:1px solid var(--bd);background:var(--card);color:var(--tx);border-radius:10px;padding:8px 12px}
button.p{background:var(--ac);border-color:var(--ac);color:#fff;font-weight:600}
button:disabled{opacity:.45;cursor:default}
.chips{display:flex;flex-wrap:wrap;gap:8px}
.chip{border-radius:999px;padding:7px 14px}
.chip.on{background:var(--ac2);border-color:var(--ac);color:var(--ac)}
.row{display:flex;align-items:center;gap:8px;padding:8px 0;border-bottom:1px solid var(--bd)}
.row:last-child{border:0}
.pos{width:28px;font-weight:700;color:var(--ac)}
.nm{flex:1}
.bar{height:10px;border-radius:6px;background:var(--ac);margin-top:4px;min-width:3px}
.mu{color:var(--mu);font-size:14px}
.med{font-size:20px;width:30px}
.err{border-color:#dc2626;color:#dc2626}
code{background:var(--bg);padding:2px 6px;border-radius:6px}
</style>
</head>
<body>
<main id="app"><p class="mu">Carregando…</p></main>
<script>
/* ============ CONFIGURAÇÃO ============
   Cole aqui o endereço do seu Firebase Realtime Database, entre aspas.
   Exemplo: "https://meu-ranking-default-rtdb.firebaseio.com"
   (veja o README.md para o passo a passo)                                   */
const FIREBASE_URL="https://NOME-default-rtdb.firebaseio.com";

/* Opções iniciais do ranking (o dono pode editar depois pelo site, abrindo o link com #dono no final) */
const DEFAULT_CFG={
  title:"MELHOR JOGADOR DOS AMIGOS CAPIVARA 26K",
  items:["Zoro","Zuck","Arnold","Luizote","Biel","Romulo","Cachorro","Higor","Lacay","Brunão","Léo","Jaba","Balkin","Richard","Gordin","Samuca"],
  topN:5
};
/* ====================================== */

const base=FIREBASE_URL.replace(/\/+$/,"");
const ready=!!base;
const isOwner=/dono/i.test(location.hash);
const medals=["🥇","🥈","🥉"];
let cfg=DEFAULT_CFG,votes=[],picks=[],myItem=null,myName="",saved=false,tab="vote",editing=false,draft=null,err="",restored=false;

const esc=t=>String(t).replace(/[&<>"]/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;"}[c]));
const keyOf=n=>encodeURIComponent(String(n).trim().toLowerCase().replace(/[.$#\[\]\/]/g,"_"));
async function api(path,method,body){
  const r=await fetch(base+"/"+path+".json",{method:method||"GET",body:body!==undefined?JSON.stringify(body):undefined});
  if(!r.ok)throw new Error("http "+r.status);
  return r.json();
}
function voterName(){return myItem||(myName||"").trim();}

function scores(){
  const N=+cfg.topN||5,t={};
  cfg.items.forEach(i=>t[i]={pts:0,v:0});
  votes.forEach(v=>{
    const seen=new Set();
    (v.picks||[]).slice(0,N).forEach((it,i)=>{
      if(t[it]&&it!==v.me&&!seen.has(it)){seen.add(it);t[it].pts+=N-i;t[it].v++;}
    });
  });
  return Object.entries(t).sort((a,b)=>b[1].pts-a[1].pts||b[1].v-a[1].v||a[0].localeCompare(b[0])).map(([n,o])=>({n,...o}));
}

function render(){
  const el=document.getElementById("app");
  const N=+cfg.topN||5;
  let h=`<h1>${esc(cfg.title)}</h1><p class="s">Cada amigo escolhe seu top ${N}. O ranking geral soma os pontos de todos. ${votes.length} voto(s) até agora.</p>`;
  if(!ready&&isOwner)h+=`<div class="card err"><b>Falta configurar o banco de dados.</b><br>Abra o arquivo <code>index.html</code>, cole o endereço do Firebase em <code>FIREBASE_URL</code> e suba de novo. O passo a passo está no README.</div>`;
  if(err)h+=`<div class="card err">${esc(err)}</div>`;
  h+=`<div class="chips" style="margin-bottom:16px"><button class="chip ${tab=="vote"&&!editing?"on":""}" onclick="editing=false;tab='vote';render()">Meu voto</button><button class="chip ${tab=="res"&&!editing?"on":""}" onclick="editing=false;tab='res';render()">Ranking geral</button>${isOwner?'<button class="chip" onclick="startEdit()">✏️ Editar opções</button>':""}</div>`;
  if(editing){
    h+=`<div class="card"><h2>Editar ranking</h2><label>Título</label><input id="e1" value="${esc(draft.t)}" oninput="draft.t=this.value">
    <label>Opções (uma por linha, pode acrescentar quem faltou)</label><textarea id="e2" rows="10" oninput="draft.it=this.value">${esc(draft.it)}</textarea>
    <label>Quantos itens cada um escolhe?</label><input id="e3" type="number" min="1" max="30" value="${esc(draft.n)}" oninput="draft.n=this.value">
    <p class="mu">Os votos já enviados são mantidos. Se você remover uma opção, ela deixa de contar nos pontos.</p>
    <button class="p" onclick="saveEdit()">Salvar alterações</button> <button onclick="editing=false;render()">Cancelar</button></div>`;
  }else if(tab=="vote"){
    picks=picks.filter(p=>cfg.items.includes(p)&&p!==myItem);
    const free=cfg.items.filter(i=>!picks.includes(i)&&i!==myItem);
    const sel=myItem===null?"__":myItem===""?"__none":myItem;
    h+=`<div class="card"><h2>Quem é você?</h2><p class="mu" style="margin:0 0 8px">Ninguém pode votar em si mesmo: a sua opção some da lista de votação.</p>
    <select id="who" onchange="setWho(this.value)"><option value="__" disabled ${sel=="__"?"selected":""}>Escolha…</option><option value="__none" ${sel=="__none"?"selected":""}>Não estou na lista</option>${cfg.items.map(i=>`<option value="${esc(i)}" ${sel==i?"selected":""}>${esc(i)}</option>`).join("")}</select>
    ${myItem===""?`<input id="nm" value="${esc(myName)}" placeholder="Seu nome" oninput="myName=this.value;remember()">`:""}</div>`;
    if(myItem!==null){
      const ok=picks.length&&voterName();
      h+=`<div class="card"><h2>Sua lista (${picks.length}/${N})</h2>`;
      if(!picks.length)h+='<p class="mu">Toque nas opções abaixo para montar sua lista em ordem.</p>';
      picks.forEach((p,i)=>{h+=`<div class="row"><span class="pos">${i+1}º</span><span class="nm">${esc(p)}</span>
        <button ${i==0?"disabled":""} onclick="mv(${i},-1)">↑</button><button ${i==picks.length-1?"disabled":""} onclick="mv(${i},1)">↓</button><button onclick="rm(${i})">✕</button></div>`});
      h+=`</div><div class="card"><h2>Opções</h2><div class="chips">`;
      free.forEach(i=>h+=`<button class="chip" ${picks.length>=N?"disabled":""} onclick="add(this.dataset.v)" data-v="${esc(i)}">${esc(i)}</button>`);
      if(!free.length)h+='<span class="mu">Todas escolhidas.</span>';
      h+=`</div></div><div class="card"><button class="p" ${ok&&ready?"":"disabled"} onclick="save()">${saved?"Atualizar meu voto":"Enviar meu voto"}</button> ${saved?'<span class="mu">✓ voto salvo</span>':""}</div>`;
    }
  }else{
    const s=scores(),max=Math.max(1,...s.map(x=>x.pts));
    h+='<div class="card">';
    s.forEach((x,i)=>{h+=`<div class="row"><span class="${i<3?"med":"pos"}">${i<3&&x.pts?medals[i]:i+1+"º"}</span><span class="nm">${esc(x.n)}<div class="bar" style="width:${x.pts/max*100}%"></div></span><span class="mu">${x.pts} pts · ${x.v} voto(s)</span></div>`});
    h+='</div><div class="card"><h2>Quem já votou</h2><p class="mu">'+(votes.length?votes.map(v=>esc(v.name||"Anônimo")).join(", "):"Ninguém ainda.")+'</p></div>';
  }
  const a=document.activeElement&&document.activeElement.id,pos=document.activeElement&&document.activeElement.selectionStart;
  el.innerHTML=h;
  if(a){const e=document.getElementById(a);if(e){e.focus();try{e.setSelectionRange(pos,pos)}catch(_){}}}
}

function remember(){try{localStorage.setItem("rk-id",JSON.stringify({item:myItem,name:myName}));}catch(e){}}
function setWho(v){myItem=v=="__"?null:v=="__none"?"":v;saved=false;remember();render();}
function add(v){if(picks.length<(+cfg.topN||5)&&!picks.includes(v)){picks.push(v);saved=false;render();}}
function rm(i){picks.splice(i,1);saved=false;render();}
function mv(i,d){const j=i+d;[picks[i],picks[j]]=[picks[j],picks[i]];saved=false;render();}

async function save(){
  const name=voterName();
  try{
    await api("votes/"+keyOf(name),"PUT",{name,me:myItem,picks:picks.filter(x=>x!==myItem),at:Date.now()});
    saved=true;err="";await load();
  }catch(e){err="Não consegui salvar o voto. Confira o link do Firebase e as regras do banco.";render();}
}
function startEdit(){draft={t:cfg.title,it:cfg.items.join("\n"),n:cfg.topN};editing=true;render();}
async function saveEdit(){
  const title=draft.t.trim(),items=[...new Set(draft.it.split("\n").map(x=>x.trim()).filter(Boolean))];
  let n=parseInt(draft.n)||5;
  if(!title||items.length<2){alert("Coloque um título e pelo menos 2 opções.");return;}
  n=Math.min(n,items.length);
  if(!ready){alert("Configure o Firebase primeiro.");return;}
  try{await api("config","PUT",{title,items,topN:n});editing=false;err="";await load();}
  catch(e){alert("Erro ao salvar as alterações.");}
}

async function load(){
  if(!ready){render();return;}
  try{
    const [c,v]=await Promise.all([api("config"),api("votes")]);
    if(c&&Array.isArray(c.items)&&c.items.length>1)cfg={title:c.title||DEFAULT_CFG.title,items:c.items,topN:+c.topN||5};
    votes=v?Object.values(v):[];
    if(!restored){
      restored=true;
      try{
        const d=JSON.parse(localStorage.getItem("rk-id")||"null");
        if(d){myItem=typeof d.item==="string"?d.item:null;myName=d.name||"";
          const mine=votes.find(x=>x.name&&keyOf(x.name)===keyOf(voterName()||"~"));
          if(mine){picks=[...(mine.picks||[])];saved=true;}}
      }catch(e){}
    }
    err="";
  }catch(e){err="Não consegui falar com o banco de dados. Confira o link do Firebase.";}
  if(!editing)render();
}

render();
load();
setInterval(()=>{if(!editing&&!(document.activeElement&&document.activeElement.id==="nm"))load();},6000);
</script>
</body>
</html>
